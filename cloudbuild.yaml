steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build -t europe-west3-docker.pkg.dev/$PROJECT_ID/aura-cafe-qr-menu/aura-cafe-qr-menu:$_TAG \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=$_FIREBASE_API_KEY \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_FIREBASE_STORAGE_BUCKET \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_FIREBASE_MESSAGING_SENDER_ID \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=$_FIREBASE_APP_ID \
          --build-arg NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID=$_FIREBASE_FIRESTORE_DATABASE_ID \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/aura-cafe-qr-menu/aura-cafe-qr-menu:$_TAG'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--image'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/aura-cafe-qr-menu/aura-cafe-qr-menu:$_TAG'
      - '--region'
      - 'europe-west3'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'APP_ENV=$_ENV'

substitutions:
  _TAG: 'latest'
  _SERVICE: 'aura-cafe-qr-menu'
  _ENV: 'production'
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_STORAGE_BUCKET: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_FIRESTORE_DATABASE_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
