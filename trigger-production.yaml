# Cloud Build trigger: deploy to PRODUCTION on push to production branch.
# Створено через gcloud CLI (з повними Firebase substitutions у тригері).
# Цей файл — документація конфігурації, не джерело для import (секрети не зберігаються в репо).
name: deploy-production
description: Production deploy on push to production branch
filename: cloudbuild.yaml
repositoryEventConfig:
  repository: projects/gen-lang-client-0366868514/locations/europe-west3/connections/github-connection/repositories/svit-kavu-qr-menu
  push:
    branch: ^production$
serviceAccount: projects/gen-lang-client-0366868514/serviceAccounts/12521585156-compute@developer.gserviceaccount.com
substitutions:
  _TAG: prod
  _SERVICE: aura-cafe-qr-menu
  _ENV: production
  # _FIREBASE_* — задаються в тригері через gcloud (з .env.local), не комітяться
